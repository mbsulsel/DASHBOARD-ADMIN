<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Command Center — Admin MB Sulsel</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{
margin:0;
font-family:Arial,sans-serif;
background:#090909;
color:#eee
}
header{
background:#111;
border-bottom:2px solid #ff7900;
padding:14px
}
.head{
max-width:1100px;
margin:auto;
display:flex;
align-items:center;
gap:12px
}
.logo{
width:52px;
height:52px;
object-fit:contain
}
h1{
font-size:17px;
margin:0;
color:#fff
}
h2{
font-size:12px;
margin:4px 0;
color:#ff7900
}
nav{
background:#111;
border-bottom:1px solid #222;
overflow-x:auto;
white-space:nowrap
}
nav button{
background:none;
border:0;
color:#bbb;
padding:13px;
font-weight:bold
}
nav button:hover,
nav button.active{
background:#ff7900;
color:#fff
}
main{
max-width:1100px;
margin:auto;
padding:14px
}
.page{display:none}
.page.active{display:block}
.box{
background:#111;
border:1px solid #292929;
border-radius:10px;
padding:15px;
margin-bottom:12px;
box-shadow:0 0 12px #000
}
.box h3{
margin:0 0 12px;
color:#ff7900;
font-size:15px
}
.grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:9px
}
label{
font-size:11px;
font-weight:bold;
display:block;
margin-bottom:4px;
color:#ddd
}
input,textarea,select{
width:100%;
padding:10px;
border:1px solid #333;
border-radius:7px;
background:#191919;
color:#fff;
font:inherit;
outline:none
}
input:focus,textarea:focus,select:focus{
border-color:#ff7900
}
textarea{min-height:75px}
.btn{
border:0;
border-radius:7px;
padding:10px 14px;
background:#ff7900;
color:#fff;
font-weight:bold;
cursor:pointer
}
.btn:hover{background:#ff8d26}
.btn.dark{background:#222}
.actions{
display:flex;
gap:7px;
margin-top:12px;
flex-wrap:wrap
}
.login{
max-width:400px;
margin:70px auto;
padding:25px
}
.login img{
display:block;
margin:auto;
width:80px;
height:80px;
object-fit:contain
}
.login h2{
text-align:center;
font-size:19px;
color:#ff7900
}
.login p{
text-align:center;
font-size:11px;
color:#888
}
.login .btn{
width:100%;
margin-top:12px
}
.msg{
padding:10px;
border-radius:7px;
margin-top:10px;
font-size:11px;
display:none
}
.ok{
background:#102617;
color:#6ee79b;
border:1px solid #176b35
}
.err{
background:#2b1111;
color:#ff7777;
border:1px solid #8b2222
}
.table-wrap{overflow:auto}
table{
width:100%;
border-collapse:collapse;
min-width:700px
}
th,td{
padding:9px;
border-bottom:1px solid #292929;
text-align:left;
font-size:11px
}
th{
background:#1b1b1b;
color:#ff7900
}
.badge{
padding:5px 8px;
border-radius:20px;
font-size:9px;
font-weight:bold;
color:#fff
}
.green{background:#179447}
.orange{background:#ef9000}
.gray{background:#555}
.progress-bg{
height:7px;
background:#292929;
border-radius:10px;
overflow:hidden;
margin-top:5px
}
.progress-bar{
height:100%;
background:#ff7900
}
.user{
font-size:11px;
color:#888
}
#app{display:none}
@media(max-width:650px){
.grid{grid-template-columns:1fr}
h1{font-size:14px}
}
</style>
</head>

<body>

<div id="loginPage" class="login box">

<img src="https://rgffzcpsofmjnqdfyolg.supabase.co/storage/v1/object/public/QRIS/1000583091-removebg-preview.png">

<h2>COMMAND CENTER</h2>
<p>ADMIN MUDA BERGERAK SULAWESI SELATAN</p>

<label>Username</label>
<input id="username" autocomplete="username" placeholder="Username">

<label style="margin-top:10px">Password</label>
<input id="password" type="password" autocomplete="current-password" placeholder="Password">

<button class="btn" onclick="login()">LOGIN</button>

<div id="loginMsg" class="msg"></div>

</div>


<div id="app">

<header>
<div class="head">

<img class="logo" src="https://rgffzcpsofmjnqdfyolg.supabase.co/storage/v1/object/public/QRIS/1000583091-removebg-preview.png">

<div>
<h1>MUDA BERGERAK SULAWESI SELATAN</h1>
<h2>COMMAND CENTER — ADMIN</h2>
<div class="user" id="userInfo"></div>
</div>

</div>
</header>

<nav>
<button class="active" onclick="page('dpw',this)">Struktur DPW</button>
<button onclick="page('dpd',this)">24 DPD</button>
<button onclick="page('bidang',this)">Bidang DPD</button>
<button onclick="logout()">Keluar</button>
</nav>

<main>

<section id="dpw" class="page active">

<div class="box">
<h3>STRUKTUR DPW MUDA BERGERAK SULAWESI SELATAN</h3>

<div class="grid">

<div><label>Ketua DPW</label><input id="dpw_ketua"></div>
<div><label>Sekretaris</label><input id="dpw_sekretaris"></div>
<div><label>Bendahara</label><input id="dpw_bendahara"></div>
<div><label>Sekretariat</label><input id="dpw_sekretariat"></div>

<div><label>Bidang Politik</label><input id="dpw_politik"></div>
<div><label>Bidang Hukum</label><input id="dpw_hukum"></div>
<div><label>Bidang Sosial Kemasyarakatan</label><input id="dpw_sosial_kemasyarakatan"></div>
<div><label>Bidang Keorganisasian</label><input id="dpw_keorganisasian"></div>
<div><label>Bidang Humas & Media</label><input id="dpw_humas_media"></div>
<div><label>Bidang Ekonomi Kreatif</label><input id="dpw_ekonomi_kreatif"></div>

</div>

<div class="actions">
<button class="btn" onclick="saveDPW()">💾 SIMPAN STRUKTUR DPW</button>
</div>

<div id="dpwMsg" class="msg"></div>
</div>

<div class="box">
<h3>PROGRESS STRUKTUR DPW</h3>
<div style="font-size:30px;font-weight:bold" id="dpwProgress">0%</div>
<div class="progress-bg">
<div class="progress-bar" id="dpwBar" style="width:0%"></div>
</div>
</div>

</section>


<section id="dpd" class="page">

<div class="box">
<h3>MONITORING & EDIT 24 DPD</h3>
<input id="cariDPD" placeholder="🔎 Cari Kabupaten/Kota..." oninput="renderDPD()">
</div>

<div id="dpdList"></div>

</section>


<section id="bidang" class="page">

<div class="box">
<h3>EDIT BIDANG DPD</h3>

<label>Pilih DPD</label>
<select id="bidangDPD" onchange="loadBidang()"></select>

<div id="bidangForm" style="margin-top:12px"></div>

<div class="actions">
<button class="btn" onclick="saveBidang()">💾 SIMPAN BIDANG</button>
</div>

<div id="bidangMsg" class="msg"></div>

</div>

</section>

</main>
</div>


<script>
"use strict";

const URL="https://rgffzcpsofmjnqdfyolg.supabase.co";
const KEY="sb_publishable_ZfZ1m8X7gadvnoAQh9XmNg_hyupNKb6";

const db=window.supabase.createClient(URL,KEY,{
auth:{
persistSession:true,
autoRefreshToken:true,
detectSessionInUrl:false
}
});

const LOGIN_URL=URL+"/functions/v1/admin-login";

let currentUser=null;
let currentAdmin=null;
let dpds=[];
let bidangRows=[];
let dpwData=null;
let selectedBidangDPD=null;

const BIDANG=[
"Politik",
"Hukum",
"Sosial Kemasyarakatan",
"Keorganisasian",
"Humas & Media",
"Ekonomi Kreatif"
];

const DPW_FIELDS=[
["ketua","dpw_ketua"],
["sekretaris","dpw_sekretaris"],
["bendahara","dpw_bendahara"],
["sekretariat","dpw_sekretariat"],
["politik","dpw_politik"],
["hukum","dpw_hukum"],
["sosial_kemasyarakatan","dpw_sosial_kemasyarakatan"],
["keorganisasian","dpw_keorganisasian"],
["humas_media","dpw_humas_media"],
["ekonomi_kreatif","dpw_ekonomi_kreatif"]
];

function msg(id,text,ok){
const x=document.getElementById(id);
x.style.display="block";
x.className="msg "+(ok?"ok":"err");
x.textContent=text;
}

async function login(){

const username=document.getElementById("username").value.trim();
const password=document.getElementById("password").value;

if(!username||!password){
msg("loginMsg","Username dan password wajib diisi.",false);
return;
}

msg("loginMsg","Memeriksa login...",true);

try{

const r=await fetch(LOGIN_URL,{
method:"POST",
headers:{
"Content-Type":"application/json",
"apikey":KEY
},
body:JSON.stringify({username,password})
});

const result=await r.json();

if(!r.ok){
msg("loginMsg",result.error||"Login gagal.",false);
return;
}

if(!result.session||!result.admin){
msg("loginMsg","Data login tidak lengkap.",false);
return;
}

const {error}=await db.auth.setSession({
access_token:result.session.access_token,
refresh_token:result.session.refresh_token
});

if(error)throw error;

currentUser=result.session.user;
currentAdmin=result.admin;

openApp();

}catch(e){
console.error(e);
msg("loginMsg","Gagal login: "+e.message,false);
}
}

async function checkSession(){

const {data}=await db.auth.getSession();

if(!data.session)return;

currentUser=data.session.user;

const {data:admin}=await db
.from("ADMIN_USERS")
.select("*")
.eq("user_id",currentUser.id)
.maybeSingle();

if(admin){
currentAdmin=admin;
openApp();
}
}

function openApp(){

document.getElementById("loginPage").style.display="none";
document.getElementById("app").style.display="block";

document.getElementById("userInfo").textContent=
(currentAdmin.username||"Admin")+" • "+currentAdmin.role;

loadAll();
}

async function logout(){
await db.auth.signOut();
location.reload();
}

function page(id,btn){

document.querySelectorAll(".page")
.forEach(x=>x.classList.remove("active"));

document.getElementById(id).classList.add("active");

document.querySelectorAll("nav button")
.forEach(x=>x.classList.remove("active"));

if(btn)btn.classList.add("active");

if(id==="dpd")renderDPD();
if(id==="bidang")loadBidangSelect();
}

async function loadAll(){
await loadDPW();
await loadDPD();
await loadBidangData();
renderDPD();
loadBidangSelect();
}

async function loadDPW(){

const {data,error}=await db
.from("struktur_dpw")
.select("*")
.limit(1)
.maybeSingle();

if(error){
console.error(error);
return;
}

dpwData=data;

if(!data)return;

DPW_FIELDS.forEach(x=>{
document.getElementById(x[1]).value=data[x[0]]||"";
});

updateDPWProgress();
}

async function saveDPW(){

if(!currentAdmin||currentAdmin.role!=="DPW"){
msg("dpwMsg","Anda tidak memiliki akses edit Struktur DPW.",false);
return;
}

const obj={};

DPW_FIELDS.forEach(x=>{
obj[x[0]]=document.getElementById(x[1]).value.trim();
});

obj.updated_at=new Date().toISOString();

if(!dpwData?.id){
msg("dpwMsg","Data Struktur DPW tidak ditemukan.",false);
return;
}

const {error}=await db
.from("struktur_dpw")
.update(obj)
.eq("id",dpwData.id);

if(error){
msg("dpwMsg","Gagal menyimpan: "+error.message,false);
return;
}

msg("dpwMsg","Struktur DPW berhasil disimpan.",true);
await loadDPW();
}

function updateDPWProgress(){

if(!dpwData)return;

let filled=0;

DPW_FIELDS.forEach(x=>{
if(String(dpwData[x[0]]||"").trim())filled++;
});

const p=Math.round((filled/10)*100);

document.getElementById("dpwProgress").textContent=p+"%";
document.getElementById("dpwBar").style.width=p+"%";
}

async function loadDPD(){

const {data,error}=await db
.from("DPD")
.select("*")
.order("nama");

if(error){
console.error(error);
alert("Gagal membaca DPD: "+error.message);
return;
}

dpds=data||[];
}

function calculateDPD(d){

const rows=bidangRows.filter(x=>String(x.dpd_id)===String(d.id));

let total=0;

if(String(d.ketua||"").trim())total++;
if(String(d.sekretaris||"").trim())total++;
if(String(d.bendahara||"").trim())total++;
if(String(d.sekretariat||"").trim())total++;

BIDANG.forEach(n=>{
const r=rows.find(x=>
String(x.bidang||"").trim().toLowerCase()===n.toLowerCase()
);

let p=r?Number(r.progress)||0:0;
p=Math.max(0,Math.min(100,p));
total+=p/100;
});

return Math.round(total/10*100);
}

function statusDPD(p){
if(p===100)return["SUDAH TERBENTUK","green"];
if(p>0)return["DALAM PROSES","orange"];
return["BELUM TERBENTUK","gray"];
}

function renderDPD(){

const box=document.getElementById("dpdList");
const q=(document.getElementById("cariDPD").value||"").toLowerCase();

const data=dpds.filter(d=>
String(d.nama||"").toLowerCase().includes(q)
);

if(!data.length){
box.innerHTML='<div class="box">Data DPD tidak ditemukan.</div>';
return;
}

box.innerHTML=data.map(d=>{

const p=calculateDPD(d);
const st=statusDPD(p);

return`
<div class="box">
<h3>${esc(d.nama)}</h3>

<span class="badge ${st[1]}">${st[0]}</span>

<div style="margin:10px 0;font-size:12px">
Progress DPD: <b>${p}%</b>
<div class="progress-bg">
<div class="progress-bar" style="width:${p}%"></div>
</div>
</div>

<div class="grid">

<div>
<label>Ketua</label>
<input id="ketua_${d.id}" value="${attr(d.ketua)}">
</div>

<div>
<label>Sekretaris</label>
<input id="sekretaris_${d.id}" value="${attr(d.sekretaris)}">
</div>

<div>
<label>Bendahara</label>
<input id="bendahara_${d.id}" value="${attr(d.bendahara)}">
</div>

<div>
<label>Sekretariat</label>
<input id="sekretariat_${d.id}" value="${attr(d.sekretariat)}">
</div>

</div>

<div class="actions">
<button class="btn" onclick="saveDPD('${d.id}')">💾 SIMPAN DPD</button>
</div>

<div id="msg_${d.id}" class="msg"></div>

</div>`;
}).join("");
}

async function saveDPD(id){

const d=dpds.find(x=>String(x.id)===String(id));
if(!d)return;

if(!currentAdmin){
alert("Belum login.");
return;
}

const isDPW=currentAdmin.role==="DPW";

if(!isDPW&&String(currentAdmin.dpd_id)!==String(id)){
alert("Anda hanya dapat mengedit DPD Anda sendiri.");
return;
}

const obj={
ketua:document.getElementById("ketua_"+id).value.trim(),
sekretaris:document.getElementById("sekretaris_"+id).value.trim(),
bendahara:document.getElementById("bendahara_"+id).value.trim(),
sekretariat:document.getElementById("sekretariat_"+id).value.trim()
};

const {error}=await db
.from("DPD")
.update(obj)
.eq("id",id);

if(error){
msg("msg_"+id,"Gagal menyimpan: "+error.message,false);
return;
}

msg("msg_"+id,"Data DPD berhasil disimpan.",true);

await loadDPD();
await loadBidangData();
renderDPD();
}

async function loadBidangData(){

const {data,error}=await db
.from("BIDANG_DPD")
.select("*");

if(error){
console.error(error);
return;
}

bidangRows=data||[];
}

function loadBidangSelect(){

const select=document.getElementById("bidangDPD");

if(!select)return;

let data=dpds;

if(currentAdmin&&currentAdmin.role!=="DPW"){
data=dpds.filter(d=>
String(d.id)===String(currentAdmin.dpd_id)
);
}

select.innerHTML=data.map(d=>
`<option value="${d.id}">${esc(d.nama)}</option>`
).join("");

if(data.length)selectedBidangDPD=data[0].id;

loadBidang();
}

function loadBidang(){

const id=document.getElementById("bidangDPD").value;

selectedBidangDPD=id;

const rows=bidangRows.filter(x=>String(x.dpd_id)===String(id));

const box=document.getElementById("bidangForm");

box.innerHTML=BIDANG.map(n=>{

const r=rows.find(x=>
String(x.bidang||"").trim().toLowerCase()===n.toLowerCase()
);

return`
<div class="box" style="margin-top:8px;padding:11px">
<strong style="font-size:12px;color:#ff7900">${esc(n)}</strong>

<div class="grid" style="margin-top:8px">

<div>
<label>Ketua Bidang</label>
<input id="bk_${slug(n)}" value="${attr(r?.ketua_bidang||r?.ketua||"")}">
</div>

<div>
<label>Progress</label>
<input id="bp_${slug(n)}" type="number" min="0" max="100" value="${Number(r?.progress)||0}">
</div>

</div>
</div>`;
}).join("");
}

async function saveBidang(){

const dpdId=document.getElementById("bidangDPD").value;

if(currentAdmin.role!=="DPW"&&
String(currentAdmin.dpd_id)!==String(dpdId)){
msg("bidangMsg","Anda hanya dapat mengedit bidang DPD sendiri.",false);
return;
}

for(const n of BIDANG){

const s=slug(n);

const ketua=document.getElementById("bk_"+s).value.trim();

let progress=Number(
document.getElementById("bp_"+s).value
)||0;

progress=Math.max(0,Math.min(100,progress));

const existing=bidangRows.find(x=>
String(x.dpd_id)===String(dpdId)&&
String(x.bidang||"").trim().toLowerCase()===n.toLowerCase()
);

let error;

if(existing){

({error}=await db
.from("BIDANG_DPD")
.update({
ketua_bidang:ketua,
progress:progress
})
.eq("id",existing.id));

}else{

({error}=await db
.from("BIDANG_DPD")
.insert({
dpd_id:dpdId,
bidang:n,
ketua_bidang:ketua,
progress:progress
}));
}

if(error){
msg("bidangMsg","Gagal menyimpan "+n+": "+error.message,false);
return;
}
}

msg("bidangMsg","Semua bidang berhasil disimpan.",true);

await loadBidangData();
renderDPD();
}

function slug(x){
return x.toLowerCase()
.replace(/&/g,"and")
.replace(/[^a-z0-9]+/g,"_")
.replace(/^_|_$/g,"");
}

function esc(v){
return String(v??"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");
}

function attr(v){
return esc(v);
}

checkSession();
</script>

</body>
</html>
