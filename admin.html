<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">

<title>Command Center — Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,Helvetica,sans-serif;
 background:#080808;
 color:#fff;
}
button,input,select{font:inherit}
button{cursor:pointer}

.login{
 min-height:100vh;
 display:flex;

 justify-content:center;
 padding:20px;
 background:
 radial-gradient(circle at top,#351500 0,#080808 45%);
}

.login-box{

}

.logo{

}

h1,h2,h3{margin-top:0}
.login-title{

}
.login-sub{

 color:#aaa;

}

label{

 margin:14px 0 6px;
}

input,select{

}

input:focus,select:focus{

.btn{

header{

.brand{

.brand img{

}

.brand strong{
 color:#ff7300;

}

.brand span{
 color:#888;
 font-size:11px;
}

.userbox{
 text-align:right;
 font-size:12px;
 color:#aaa;
}

.userbox b{color:#ff7300}

.logout{

 background:none;
 border:0;
 color:#ff6a00;

}

nav{
 display:flex;
 gap:8px;
 padding:12px;
 background:#101010;
 border-bottom:1px solid #222;
 overflow-x:auto;
}

nav button{

 background:#181818;
 border:1px solid #333;
 color:#aaa;
 padding:10px 14px;
 border-radius:8px;
}

nav button.active,
nav button:hover{
 background:#ff6a00;
 color:#fff;
 border-color:#ff6a00;
}

main{
 max-width:1200px;
 margin:auto;
 padding:20px;
}

.page{display:none}
.page.active{display:block}

.title{
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:15px;
 margin-bottom:18px;
}

.title h2{
 color:#ff7300;
 margin:0;
}

.card{
 background:#111;
 border:1px solid #272727;
 border-radius:14px;
 padding:18px;
 margin-bottom:18px;
}

.card h3{
 color:#ff7300;
 font-size:16px;
 margin-bottom:15px;
}

.grid{
 display:grid;
 grid-template-columns:repeat(2,minmax(0,1fr));
 gap:14px;
}

.grid3{
 display:grid;
 grid-template-columns:repeat(3,minmax(0,1fr));
 gap:14px;
}

.field label{margin-top:0}

.save{
 background:#ff6a00;
 color:#fff;
 border:0;
 border-radius:8px;
 padding:10px 18px;
 font-weight:bold;
}

.save:hover{background:#ff7b1a}

.table-wrap{
 overflow-x:auto;
}

table{
 width:100%;
 border-collapse:collapse;
 min-width:700px;
}

th,td{
 border-bottom:1px solid #292929;
 padding:11px 9px;
 text-align:left;
 font-size:13px;
}

th{
 background:#181818;
 color:#ff7300;
}

td{color:#ddd}

.badge{
 display:inline-block;
 padding:4px 8px;
 border-radius:20px;
 font-size:11px;
 background:#292929;
 color:#aaa;
}

.badge.ok{

 color:#65e27e;
}

.progress{
 height:8px;
 background:#292929;
 border-radius:20px;
 overflow:hidden;
 margin-top:5px;
}

.progress i{
 display:block;
 height:100%;
 background:#ff6a00;
}

.stat{
 background:#181818;
 border:1px solid #292929;
 border-radius:12px;
 padding:15px;
}

.stat small{
 color:#888;
 display:block;
 margin-bottom:5px;
}

.stat strong{
 color:#ff7300;
 font-size:25px;
}

.notice{
 background:#1b120b;
 border:1px solid #633000;
 color:#ffb37a;
 padding:12px;
 border-radius:9px;
 margin-bottom:15px;
 font-size:13px;
}

.hidden{display:none!important}

@media(max-width:700px){
 header{
  align-items:flex-start;
 }
 .userbox{font-size:10px}
 main{padding:12px}
 .grid,.grid3{grid-template-columns:1fr}
 .title{align-items:flex-start;flex-direction:column}
 .login-box{padding:22px}
}
</style>
</head>

<body>

<!-- LOGIN -->
<section id="loginPage" class="login">
 <div class="login-box">

  <img
   class="logo"
   src="https://rgffzcpsofmjnqdfyolg.supabase.co/storage/v1/object/public/QRIS/1000583091-removebg-preview.png"
  >

  <h2 class="login-title">COMMAND CENTER</h2>

<!-- APP -->
<section id="app" class="app">

<header>
 <div class="brand">
  <img src="https://rgffzcpsofmjnqdfyolg.supabase.co/storage/v1/object/public/QRIS/1000583091-removebg-preview.png">
  <div>

<main>

<!-- DPW -->
<section id="page-dpw" class="page">

 <div class="card">
  <div class="grid">

   <div class="field">

    <input id="dpw_ketua">
   </div>

   <div class="field">
    <label>Sekretaris</label>
    <input id="dpw_sekretaris">

   <div class="field">
    <label>Bendahara</label>
    <input id="dpw_bendahara">
   </div>

   <div class="field">
    <label>Sekretariat</label>
    <input id="dpw_sekretariat">
   </div>

    <label>Politik</label>
    <input id="dpw_politik">

    <label>Hukum</label>

<script>
/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://rgffzcpsofmjnqdfyolg.supabase.co";

const SUPABASE_KEY =
"sb_publishable_ZfZ1m8X7gadvnoAQh9XmNg_hyupNK6";

const db = window.supabase.createClient(
 SUPABASE_URL,
 SUPABASE_KEY,
 {
  auth:{
   persistSession:true,
   autoRefreshToken:true,
   detectSessionInUrl:false
  }
 }
);


/* =========================
   STATE
========================= */

let currentUser = null;
let currentAdmin = null;
let dpdData = [];
let bidangData = [];


/* =========================
   HELPER
========================= */

function msg(id,text,good=true){
 const el=document.getElementById(id);
 if(!el)return;
 el.textContent=text;
 el.style.color=good ? "#65e27e" : "#ff6868";
}

function esc(v){
 return String(v ?? "")
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");
}

function canEditDPD(id){
 return currentAdmin &&
 (
  currentAdmin.role==="DPW" ||
  Number(currentAdmin.dpd_id)===Number(id)
 );
}


/* =========================
   LOGIN
========================= */

async function login(){

 const username =
  document.getElementById("username").value.trim();

 const password =
  document.getElementById("password").value;

 if(!username || !password){
  msg(
   "loginMsg",
   "Username dan password wajib diisi.",
   false
  );
  return;
 }

 msg(
  "loginMsg",
  "Memeriksa login...",
  true
 );

 try{

  const response = await fetch(
   "https://rgffzcpsofmjnqdfyolg.supabase.co/functions/v1/admin-login",
   {
    method:"POST",
    headers:{
     "Content-Type":"application/json",
     "apikey":"sb_publishable_ZfZ1m8X7gadvnoAQh9XmNg_hyupNK6"
    },
    body:JSON.stringify({
     username:username,
     password:password
    })
   }
  );

  const result = await response.json();

  if(!response.ok){
   msg(
    "loginMsg",
    result.error || "Login gagal.",
    false
   );
   return;
  }

  if(!result.session || !result.admin){
   msg(
    "loginMsg",
    "Data login tidak lengkap.",
    false
   );
   return;
  }

  const sessionResult =
   await db.auth.setSession({
    access_token:result.session.access_token,
    refresh_token:result.session.refresh_token
   });

  if(sessionResult.error)
   throw sessionResult.error;

  currentUser =
   result.session.user;

  currentAdmin =
   result.admin;

  localStorage.setItem(
   "cc_admin",
   JSON.stringify(currentAdmin)
  );

  openApp();

 }catch(e){

  console.error(e);

  msg(
   "loginMsg",
   "Gagal login: "+e.message,
   false
  );

 }

}


/* =========================
   OPEN APP
========================= */

async function openApp(){

 document.getElementById("loginPage")
  .style.display="none";

 document.getElementById("app")
  .style.display="block";

 document.getElementById("userName")
  .innerHTML =
  "<b>"+esc(currentAdmin.username)+"</b>";

 document.getElementById("userRole")
  .textContent =
  currentAdmin.role==="DPW"
   ? "Akses DPW"
   : "DPD "+currentAdmin.dpd_id;

 if(currentAdmin.role!=="DPW"){
  document.getElementById("navDPW")
   .style.display="none";
 }

 await loadDPW();
 await loadDPD();
 await loadBidangSelect();

 const first =
  currentAdmin.role==="DPW"
   ? document.querySelector("nav button")
   : document.querySelectorAll("nav button")[1];

 showPage(
  currentAdmin.role==="DPW"
   ? "dpw"
   : "dpd",
  first
);
}


/* =========================
   LOGOUT
========================= */

async function logout(){

 await db.auth.signOut();

 localStorage.removeItem("cc_admin");

 currentUser=null;
 currentAdmin=null;

 location.reload();
}


/* =========================
   NAVIGATION
========================= */

function showPage(name,button){

 document.querySelectorAll(".page")
  .forEach(x=>x.classList.remove("active"));

 document.getElementById("page-"+name)
  .classList.add("active");

 document.querySelectorAll("nav button")
  .forEach(x=>x.classList.remove("active"));

 if(button)
  button.classList.add("active");
}


/* =========================
   DPW
========================= */

async function loadDPW(){

 const {data,error} =
  await db
   .from("struktur_dpw")
   .select("*")
   .limit(1)
   .maybeSingle();

 if(error){
  console.error(error);
  return;
 }

 if(!data)return;

 const fields=[
  "ketua",
  "sekretaris",
  "bendahara",
  "sekretariat",
  "politik",
  "hukum",
  "sosial_kemasyarakatan",
  "keorganisasian",
  "humas_media",
  "ekonomi_kreatif"
 ];

 fields.forEach(f=>{
  const el=document.getElementById("dpw_"+f);
  if(el)el.value=data[f]||"";
 });
}


async function saveDPW(){

 if(currentAdmin.role!=="DPW"){
  alert("Akses ditolak.");
  return;
 }

 const payload={
  ketua:document.getElementById("dpw_ketua").value,
  sekretaris:document.getElementById("dpw_sekretaris").value,
  bendahara:document.getElementById("dpw_bendahara").value,
  sekretariat:document.getElementById("dpw_sekretariat").value,
  politik:document.getElementById("dpw_politik").value,
  hukum:document.getElementById("dpw_hukum").value,
  sosial_kemasyarakatan:
   document.getElementById("dpw_sosial_kemasyarakatan").value,
  keorganisasian:
   document.getElementById("dpw_keorganisasian").value,
  humas_media:
   document.getElementById("dpw_humas_media").value,
  ekonomi_kreatif:
   document.getElementById("dpw_ekonomi_kreatif").value
 };

 const {data:old} =
  await db
   .from("struktur_dpw")
   .select("id")
   .limit(1)
   .maybeSingle();

 let result;

 if(old?.id){
  result=await db
   .from("struktur_dpw")
   .update(payload)
   .eq("id",old.id);
 }else{
  result=await db
   .from("struktur_dpw")
   .insert(payload);
 }

 if(result.error){
  alert("Gagal menyimpan: "+result.error.message);
  return;
 }

 alert("Struktur DPW berhasil disimpan.");
}


/* =========================
   DPD
========================= */

async function loadDPD(){

 const {data,error} =
  await db
   .from("DPD")
   .select("*")
   .order("id",{ascending:true});

 if(error){
  console.error(error);
  return;
 }

 dpdData=data||[];

 renderDPD();
}


function calcProgress(d){

 const fields=[
  d.ketua,
  d.sekretaris,
  d.bendahara,
  d.sekretariat
 ];

 const base=
  fields.filter(x=>x&&String(x).trim()).length;

 const baseProgress=
  (base/4)*40;

 return Math.round(baseProgress);
}


function renderDPD(){

 const tbody=
  document.getElementById("dpdTable");

 tbody.innerHTML="";

 dpdData.forEach((d,i)=>{

  if(
   currentAdmin.role==="DPD" &&
   Number(d.id)!==Number(currentAdmin.dpd_id)
  )return;

  const progress=
   Number(d.progress ?? calcProgress(d));

  const editable=
   canEditDPD(d.id);

  const tr=document.createElement("tr");

  tr.innerHTML=`
   <td>${i+1}</td>
   <td><b>DPD ${esc(d.id)}</b></td>
   <td>${esc(d.ketua||"-")}</td>
   <td>${esc(d.sekretariat||"-")}</td>
   <td>
    <b>${progress}%</b>
    <div class="progress">
     <i style="width:${Math.min(progress,100)}%"></i>
    </div>
   </td>
   <td>
    ${
     editable
     ? `<button class="save" onclick="editDPD(${d.id})">Edit</button>`
     : `<span class="badge">Read Only</span>`
    }
   </td>
  `;

  tbody.appendChild(tr);
 });
}


async function editDPD(id){

 if(!canEditDPD(id)){
  alert("Anda tidak memiliki akses.");
  return;
 }

 const d=
  dpdData.find(x=>Number(x.id)===Number(id));

 if(!d)return;

 const ketua=
  prompt("Ketua DPD:",d.ketua||"");

 if(ketua===null)return;

 const sekretaris=
  prompt("Sekretaris:",d.sekretaris||"");

 if(sekretaris===null)return;

 const bendahara=
  prompt("Bendahara:",d.bendahara||"");

 if(bendahara===null)return;

 const sekretariat=
  prompt("Sekretariat:",d.sekretariat||"");

 if(sekretariat===null)return;

 const progress=
  prompt(
   "Progress struktur (0-100):",
   d.progress ?? calcProgress({
    ketua,
    sekretaris,
    bendahara,
    sekretariat
   })
  );

 if(progress===null)return;

 const p=
  Math.max(0,Math.min(100,Number(progress)||0));

 const {error}=
  await db
   .from("DPD")
   .update({
    ketua,
    sekretaris,
    bendahara,
    sekretariat,
    progress:p
   })
   .eq("id",id);

 if(error){
  alert("Gagal menyimpan: "+error.message);
  return;
 }

 alert("Data DPD berhasil disimpan.");

 await loadDPD();
}


/* =========================
   BIDANG
========================= */

async function loadBidangSelect(){

 const select=
  document.getElementById("bidangDPD");

 select.innerHTML="";

 for(let i=1;i<=24;i++){

  if(
   currentAdmin.role==="DPD" &&
   Number(currentAdmin.dpd_id)!==i
  )continue;

  const option=
   document.createElement("option");

  option.value=i;
  option.textContent="DPD "+i;

  select.appendChild(option);
 }

 await loadBidang();
}


async function loadBidang(){

 const id=
  Number(document.getElementById("bidangDPD").value);

 if(!id)return;

 const {data,error}=
  await db
   .from("BIDANG_DPD")
   .select("*")
   .eq("dpd_id",id);

 if(error){
  console.error(error);
  return;
 }

 bidangData=data||[];

 const names={
  politik:"Politik",
  hukum:"Hukum",
  sosial:"Sosial",
  organisasi:"Organisasi",
  humas:"Humas",
  ekonomi:"Ekonomi"
 };

 Object.keys(names).forEach(k=>{

  const row=
   bidangData.find(x=>
    String(x.bidang||"")
     .toLowerCase()
     .includes(names[k].toLowerCase())
  );

  const ketua=
   document.getElementById("b_"+k+"_ketua");

  const progress=
   document.getElementById("b_"+k+"_progress");

  if(ketua)ketua.value=row?.ketua_bidang||"";
  if(progress)progress.value=row?.progress||0;
 });

 document.getElementById("bidangBox")
  .classList.remove("hidden");
}


async function saveBidang(){

 const id=
  Number(document.getElementById("bidangDPD").value);

 if(
  currentAdmin.role==="DPD" &&
  Number(currentAdmin.dpd_id)!==id
 ){
  alert("Anda tidak memiliki akses.");
  return;
 }

 const rows=[
  ["Politik","politik"],
  ["Hukum","hukum"],
  ["Sosial Kemasyarakatan","sosial"],
  ["Keorganisasian","organisasi"],
  ["Humas & Media","humas"],
  ["Ekonomi Kreatif","ekonomi"]
 ];

 for(const [nama,key] of rows){

  const payload={
   dpd_id:id,
   bidang:nama,
   ketua_bidang:
    document.getElementById(
     "b_"+key+"_ketua"
    ).value,
   progress:
    Math.max(
     0,
     Math.min(
      100,
      Number(
       document.getElementById(
        "b_"+key+"_progress"
       ).value
      )||0
     )
    )
  };

  const {data:existing}=
   await db
    .from("BIDANG_DPD")
    .select("id")
    .eq("dpd_id",id)
    .eq("bidang",nama)
    .maybeSingle();

  let result;

  if(existing?.id){

   result=await db
    .from("BIDANG_DPD")
    .update(payload)
    .eq("id",existing.id);

  }else{

   result=await db
    .from("BIDANG_DPD")
    .insert(payload);

  }

  if(result.error){
   alert(
    "Gagal menyimpan "+nama+": "+
    result.error.message
   );
   return;
  }
 }

 alert("Data bidang berhasil disimpan.");

 await loadBidang();
}


/* =========================
   SESSION
========================= */

async function checkSession(){

 const {data}=
  await db.auth.getSession();

 if(!data.session)return;

 const saved=
  localStorage.getItem("cc_admin");

 if(!saved)return;

 try{

  currentUser=data.session.user;
  currentAdmin=JSON.parse(saved);

  openApp();

 }catch(e){

  localStorage.removeItem("cc_admin");
  await db.auth.signOut();

 }
}


/* =========================
   START
========================= */

document.addEventListener(
 "DOMContentLoaded",
 ()=>{
  checkSession();
 }
);

</script>
