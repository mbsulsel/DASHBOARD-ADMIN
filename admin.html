<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Command Center Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{margin:0;background:#080808;color:#fff;font-family:Arial,sans-serif}
.hidden{display:none!important}
button{border:0;border-radius:8px;padding:11px 16px;background:#ff6a00;color:#fff;font-weight:bold;cursor:pointer}
button:disabled{opacity:.6}
input,select,textarea{width:100%;padding:12px;margin:6px 0 12px;background:#151515;border:1px solid #333;color:#fff;border-radius:8px}
textarea{min-height:90px;resize:vertical}
label{font-size:13px;color:#bbb}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login-box{width:100%;max-width:420px;background:#111;border:1px solid #292929;border-radius:18px;padding:30px;box-shadow:0 0 40px #000}
.logo{width:90px;height:90px;object-fit:contain;display:block;margin:auto auto 15px}
.orange{color:#ff6a00}
.msg{font-size:13px;margin-top:12px;color:#ff7777}
.app{min-height:100vh}
header{background:#111;border-bottom:1px solid #292929;padding:12px 18px;display:flex;align-items:center;justify-content:space-between;gap:15px;position:sticky;top:0;z-index:10}
.brand{display:flex;align-items:center;gap:10px}
.brand img{width:42px;height:42px;object-fit:contain}
.brand b{font-size:15px}
.user{text-align:right;font-size:12px;color:#aaa}
.user strong{color:#fff}
nav{display:flex;gap:8px;overflow:auto;padding:12px;background:#0d0d0d;border-bottom:1px solid #222}
nav button{white-space:nowrap;background:#181818;border:1px solid #333}
nav button.active{background:#ff6a00;border-color:#ff6a00}
main{padding:18px;max-width:1400px;margin:auto}
.card{background:#111;border:1px solid #292929;border-radius:14px;padding:18px;margin-bottom:18px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.section{display:none}.section.active{display:block}
.table-wrap{overflow:auto}
table{width:100%;border-collapse:collapse;min-width:700px}
th,td{padding:11px 9px;border-bottom:1px solid #292929;text-align:left;font-size:13px}
th{color:#ff6a00;background:#151515}
.badge{display:inline-block;padding:5px 9px;border-radius:20px;background:#222;font-size:11px}
.progress{height:8px;background:#252525;border-radius:20px;overflow:hidden}
.progress i{display:block;height:100%;background:#ff6a00}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.small{font-size:12px;color:#888}
hr{border:0;border-top:1px solid #292929;margin:18px 0}
@media(max-width:700px){.grid{grid-template-columns:1fr}header{align-items:flex-start}}
</style>
</head>

<body>

<div id="loginPage" class="login">
<div class="login-box">

<img class="logo" src="https://rgffzcpsofmjnqdfyolg.supabase.co/storage/v1/object/public/QRIS/1000583091-removebg-preview.png">

<h2 style="text-align:center">COMMAND <span class="orange">CENTER</span></h2>
<p style="text-align:center;color:#aaa;font-size:13px">
Muda Bergerak Sulawesi Selatan
</p>

<label>Username</label>
<input id="username" autocomplete="username" placeholder="Masukkan username">

<label>Password</label>
<input id="password" type="password" autocomplete="current-password" placeholder="Masukkan password">

<button id="loginBtn" onclick="login()" style="width:100%">LOGIN</button>

<div id="loginMsg" class="msg"></div>

</div>
</div>


<div id="app" class="app hidden">

<header>
<div class="brand">
<img src="https://rgffzcpsofmjnqdfyolg.supabase.co/storage/v1/object/public/QRIS/1000583091-removebg-preview.png">
<div>
<b>COMMAND CENTER</b>
<div class="small">Muda Bergerak Sulawesi Selatan</div>
</div>
</div>

<div class="user">
<strong id="currentUsername">-</strong><br>
<span id="currentRole">-</span><br>
<button onclick="logout()" style="padding:6px 10px;margin-top:5px">Logout</button>
</div>
</header>


<nav>
<button id="navDPW" onclick="showSection('dpw')">Struktur DPW</button>
<button id="navDPD" onclick="showSection('dpd')">24 DPD</button>
<button id="navBidang" onclick="showSection('bidang')">Bidang DPD</button>
</nav>


<main>

<section id="sec-dpw" class="section">

<div class="card">
<h2>Struktur <span class="orange">DPW</span></h2>

<div class="grid">

<div><label>Ketua</label><input id="dpw_ketua"></div>
<div><label>Sekretaris</label><input id="dpw_sekretaris"></div>
<div><label>Bendahara</label><input id="dpw_bendahara"></div>
<div><label>Sekretariat</label><input id="dpw_sekretariat"></div>

<div><label>Politik</label><textarea id="dpw_politik"></textarea></div>
<div><label>Hukum</label><textarea id="dpw_hukum"></textarea></div>
<div><label>Sosial Kemasyarakatan</label><textarea id="dpw_sosial_kemasyarakatan"></textarea></div>
<div><label>Keorganisasian</label><textarea id="dpw_keorganisasian"></textarea></div>
<div><label>Humas & Media</label><textarea id="dpw_humas_media"></textarea></div>
<div><label>Ekonomi Kreatif</label><textarea id="dpw_ekonomi_kreatif"></textarea></div>

</div>

<button onclick="saveDPW()">Simpan Struktur DPW</button>
<div id="dpwMsg" class="msg"></div>
</div>

</section>


<section id="sec-dpd" class="section">

<div class="card">
<h2>Monitoring <span class="orange">24 DPD</span></h2>

<div class="table-wrap">
<table>
<thead>
<tr>
<th>DPD</th>
<th>Ketua</th>
<th>Sekretariat</th>
<th>Progress</th>
<th>Aksi</th>
</tr>
</thead>
<tbody id="dpdTable"></tbody>
</table>
</div>
</div>


<div id="editDPDCard" class="card hidden">

<h2>Edit <span class="orange">DPD</span></h2>

<input type="hidden" id="edit_dpd_id">

<div class="grid">

<div><label>Ketua</label><input id="edit_ketua"></div>
<div><label>Sekretaris</label><input id="edit_sekretaris"></div>
<div><label>Bendahara</label><input id="edit_bendahara"></div>
<div><label>Sekretariat</label><input id="edit_sekretariat"></div>
<div><label>Progress (%)</label><input id="edit_progress" type="number" min="0" max="100"></div>

</div>

<div class="actions">
<button onclick="saveDPD()">Simpan</button>
<button onclick="closeEditDPD()" style="background:#333">Batal</button>
</div>

<div id="dpdMsg" class="msg"></div>
</div>

</section>


<section id="sec-bidang" class="section">

<div class="card">

<h2>Bidang <span class="orange">DPD</span></h2>

<label>Pilih DPD</label>
<select id="bidangDPD" onchange="loadBidang()"></select>

<hr>

<div class="grid">

<div><label>Politik</label><textarea id="bidang_politik"></textarea></div>
<div><label>Hukum</label><textarea id="bidang_hukum"></textarea></div>
<div><label>Sosial Kemasyarakatan</label><textarea id="bidang_sosial"></textarea></div>
<div><label>Keorganisasian</label><textarea id="bidang_organisasi"></textarea></div>
<div><label>Humas & Media</label><textarea id="bidang_humas"></textarea></div>
<div><label>Ekonomi Kreatif</label><textarea id="bidang_ekonomi"></textarea></div>

</div>

<button onclick="saveBidang()">Simpan Bidang</button>
<div id="bidangMsg" class="msg"></div>

</div>
</section>

</main>
</div>


<script>

const SUPABASE_URL="https://rgffzcpsofmjnqdfyolg.supabase.co";
const SUPABASE_KEY="sb_publishable_ZfZ1m8X7gadvnoAQh9XmNg_hyupNK6";

const db=window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY,
{
auth:{
persistSession:true,
autoRefreshToken:true,
detectSessionInUrl:false
}
}
);

let currentUser=null;
let currentAdmin=null;


function msg(id,text,ok=false){
const el=document.getElementById(id);
if(!el)return;
el.textContent=text;
el.style.color=ok?"#65e572":"#ff7777";
}


function esc(v){
return String(v??"")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;");
}


/* LOGIN */

async function login(){

const username=document.getElementById("username").value.trim();
const password=document.getElementById("password").value;
const btn=document.getElementById("loginBtn");

if(!username||!password){
msg("loginMsg","Username dan password wajib diisi.");
return;
}

btn.disabled=true;
btn.textContent="Memeriksa Login...";
msg("loginMsg","Memeriksa Login...",true);

try{

/* PENTING:
   Tidak mengirim API KEY di header.
   Edge Function admin-login menangani autentikasi.
*/

const response=await fetch(
SUPABASE_URL+"/functions/v1/admin-login",
{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
username:username,
password:password
})
}
);

const text=await response.text();

let result;

try{
result=JSON.parse(text);
}catch{
throw new Error(
"Respons server tidak valid: "+text.substring(0,200)
);
}

if(!response.ok){
throw new Error(
result.error||
result.message||
"Login gagal ("+response.status+")"
);
}

if(!result.session){
throw new Error("Session login tidak diterima.");
}

if(!result.session.access_token||
!result.session.refresh_token){
throw new Error("Token login tidak lengkap.");
}


/* MASUKKAN SESSION KE BROWSER */

const sessionResult=await db.auth.setSession({
access_token:result.session.access_token,
refresh_token:result.session.refresh_token
});

if(sessionResult.error){
throw new Error(
"Session gagal: "+sessionResult.error.message
);
}

currentUser=
sessionResult.data?.session?.user||
result.session.user;

currentAdmin=result.admin;

localStorage.setItem(
"cc_admin",
JSON.stringify(currentAdmin)
);

msg("loginMsg","Login berhasil.",true);

await openApp();

}catch(e){

console.error(e);

msg(
"loginMsg",
e?.message||"Login gagal."
);

}finally{

btn.disabled=false;
btn.textContent="LOGIN";

}

}


/* SESSION */

async function checkSession(){

try{

const {data,error}=await db.auth.getSession();

if(error||!data.session)return;

const saved=localStorage.getItem("cc_admin");

if(!saved)return;

currentUser=data.session.user;
currentAdmin=JSON.parse(saved);

await openApp();

}catch(e){

console.error(e);

}

}


/* OPEN APP */

async function openApp(){

document.getElementById("loginPage").classList.add("hidden");
document.getElementById("app").classList.remove("hidden");

document.getElementById("currentUsername").textContent=
currentAdmin?.username||"-";

document.getElementById("currentRole").textContent=
currentAdmin?.role||"-";

applyPermissions();

if(currentAdmin?.role==="DPD"){
showSection("dpd");
}else{
showSection("dpw");
}

try{await loadDPW()}catch(e){console.error(e)}
try{await loadDPD()}catch(e){console.error(e)}
try{await loadBidangSelect()}catch(e){console.error(e)}

}


/* PERMISSION */

function applyPermissions(){

if(currentAdmin?.role==="DPD"){

document.getElementById("navDPW").style.display="none";

}else{

document.getElementById("navDPW").style.display="block";

}

}


/* NAV */

function showSection(name){

document.querySelectorAll(".section")
.forEach(x=>x.classList.remove("active"));

document.querySelectorAll("nav button")
.forEach(x=>x.classList.remove("active"));

document.getElementById("sec-"+name)?.classList.add("active");

const map={
dpw:"navDPW",
dpd:"navDPD",
bidang:"navBidang"
};

document.getElementById(map[name])?.classList.add("active");

}


/* DPW */

async function loadDPW(){

const {data,error}=await db
.from("struktur_dpw")
.select("*")
.limit(1)
.maybeSingle();

if(error){
console.error(error);
return;
}

if(!data)return;

[
"ketua",
"sekretaris",
"bendahara",
"sekretariat",
"politik",
"hukum",
"sosial_kemasyarakatan",
"keorganisasian",
"humas_media",
"ekonomi_kreatif"
].forEach(f=>{

const el=document.getElementById("dpw_"+f);

if(el)el.value=data[f]||"";

});

}


async function saveDPW(){

if(currentAdmin?.role!=="DPW"){
msg("dpwMsg","Hanya admin DPW yang dapat mengubah data.");
return;
}

const payload={};

[
"ketua",
"sekretaris",
"bendahara",
"sekretariat",
"politik",
"hukum",
"sosial_kemasyarakatan",
"keorganisasian",
"humas_media",
"ekonomi_kreatif"
].forEach(f=>{
payload[f]=document.getElementById("dpw_"+f)?.value||"";
});

const {data:old,error}=await db
.from("struktur_dpw")
.select("id")
.limit(1)
.maybeSingle();

if(error){
msg("dpwMsg",error.message);
return;
}

let result;

if(old?.id){

result=await db
.from("struktur_dpw")
.update(payload)
.eq("id",old.id);

}else{

result=await db
.from("struktur_dpw")
.insert(payload);

}

if(result.error){
msg("dpwMsg",result.error.message);
return;
}

msg("dpwMsg","Struktur DPW berhasil disimpan.",true);

}


/* DPD */

async function loadDPD(){

let query=db
.from("DPD")
.select("*")
.order("id");

if(currentAdmin?.role==="DPD"){
query=query.eq("id",currentAdmin.dpd_id);
}

const {data,error}=await query;

const tbody=document.getElementById("dpdTable");
tbody.innerHTML="";

if(error){
tbody.innerHTML=
`<tr><td colspan="5">${esc(error.message)}</td></tr>`;
return;
}

if(!data?.length){
tbody.innerHTML=
`<tr><td colspan="5">Belum ada data DPD.</td></tr>`;
return;
}

data.forEach(row=>{

const progress=Math.max(
0,
Math.min(100,Number(row.progress)||0)
);

const tr=document.createElement("tr");

tr.innerHTML=`
<td><span class="badge">DPD ${esc(row.id)}</span></td>
<td>${esc(row.ketua)}</td>
<td>${esc(row.sekretariat)}</td>
<td>
${progress}%
<div class="progress">
<i style="width:${progress}%"></i>
</div>
</td>
<td>
<button onclick='editDPD(${JSON.stringify(row)})'>Edit</button>
</td>
`;

tbody.appendChild(tr);

});

}


function editDPD(row){

if(
currentAdmin?.role==="DPD" &&
Number(currentAdmin.dpd_id)!==Number(row.id)
)return;

document.getElementById("editDPDCard")
.classList.remove("hidden");

document.getElementById("edit_dpd_id").value=row.id||"";
document.getElementById("edit_ketua").value=row.ketua||"";
document.getElementById("edit_sekretaris").value=row.sekretaris||"";
document.getElementById("edit_bendahara").value=row.bendahara||"";
document.getElementById("edit_sekretariat").value=row.sekretariat||"";
document.getElementById("edit_progress").value=row.progress||0;

}


function closeEditDPD(){

document.getElementById("editDPDCard")
.classList.add("hidden");

}


async function saveDPD(){

const id=document.getElementById("edit_dpd_id").value;

if(
currentAdmin?.role==="DPD" &&
Number(currentAdmin.dpd_id)!==Number(id)
){
msg("dpdMsg","Anda hanya dapat mengubah DPD sendiri.");
return;
}

const payload={
ketua:document.getElementById("edit_ketua").value,
sekretaris:document.getElementById("edit_sekretaris").value,
bendahara:document.getElementById("edit_bendahara").value,
sekretariat:document.getElementById("edit_sekretariat").value,
progress:Math.max(
0,
Math.min(
100,
Number(document.getElementById("edit_progress").value)||0
)
)
};

const {error}=await db
.from("DPD")
.update(payload)
.eq("id",id);

if(error){
msg("dpdMsg",error.message);
return;
}

msg("dpdMsg","Data DPD berhasil disimpan.",true);

closeEditDPD();
await loadDPD();

}


/* BIDANG */

async function loadBidangSelect(){

const select=document.getElementById("bidangDPD");

const {data,error}=await db
.from("DPD")
.select("id,ketua")
.order("id");

select.innerHTML="";

if(error){
console.error(error);
return;
}

let rows=data||[];

if(currentAdmin?.role==="DPD"){
rows=rows.filter(
x=>Number(x.id)===Number(currentAdmin.dpd_id)
);
}

rows.forEach(row=>{

const option=document.createElement("option");

option.value=row.id;
option.textContent=
"DPD "+row.id+
(row.ketua?" — "+row.ketua:"");

select.appendChild(option);

});

if(rows.length)await loadBidang();

}


async function loadBidang(){

const dpdId=document.getElementById("bidangDPD").value;

if(!dpdId)return;

const {data,error}=await db
.from("BIDANG_DPD")
.select("*")
.eq("dpd_id",dpdId);

if(error){
console.error(error);
return;
}

const map={
"Politik":"bidang_politik",
"Hukum":"bidang_hukum",
"Sosial Kemasyarakatan":"bidang_sosial",
"Keorganisasian":"bidang_organisasi",
"Humas & Media":"bidang_humas",
"Ekonomi Kreatif":"bidang_ekonomi"
};

Object.values(map).forEach(id=>{
document.getElementById(id).value="";
});

(data||[]).forEach(row=>{

const el=document.getElementById(map[row.bidang]);

if(el)el.value=row.ketua_bidang||"";

});

}


async function saveBidang(){

const dpdId=document.getElementById("bidangDPD").value;

if(!dpdId)return;

if(
currentAdmin?.role==="DPD" &&
Number(currentAdmin.dpd_id)!==Number(dpdId)
){
msg("bidangMsg","Anda hanya dapat mengubah DPD sendiri.");
return;
}

const fields=[
["Politik","bidang_politik"],
["Hukum","bidang_hukum"],
["Sosial Kemasyarakatan","bidang_sosial"],
["Keorganisasian","bidang_organisasi"],
["Humas & Media","bidang_humas"],
["Ekonomi Kreatif","bidang_ekonomi"]
];

for(const [bidang,element] of fields){

const value=document.getElementById(element).value;

const {data:existing,error:findError}=await db
.from("BIDANG_DPD")
.select("id")
.eq("dpd_id",dpdId)
.eq("bidang",bidang)
.maybeSingle();

if(findError){
msg("bidangMsg",findError.message);
return;
}

let result;

if(existing?.id){

result=await db
.from("BIDANG_DPD")
.update({
ketua_bidang:value
})
.eq("id",existing.id);

}else{

result=await db
.from("BIDANG_DPD")
.insert({
dpd_id:dpdId,
bidang:bidang,
ketua_bidang:value,
progress:0
});

}

if(result.error){
msg("bidangMsg",result.error.message);
return;
}

}

msg("bidangMsg","Data bidang berhasil disimpan.",true);

await loadBidang();

}


/* LOGOUT */

async function logout(){

await db.auth.signOut();

localStorage.removeItem("cc_admin");

currentUser=null;
currentAdmin=null;

document.getElementById("app").classList.add("hidden");
document.getElementById("loginPage").classList.remove("hidden");

document.getElementById("username").value="";
document.getElementById("password").value="";

msg("loginMsg","");

}


/* ENTER */

document.getElementById("password")
.addEventListener("keydown",e=>{
if(e.key==="Enter")login();
});


/* START */

checkSession();

</script>

</body>
</html>
