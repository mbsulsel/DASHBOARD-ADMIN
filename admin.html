<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Command Center Muda Bergerak Sulsel</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#111;color:#fff}
button{cursor:pointer;border:0;border-radius:8px;padding:11px 15px;font-weight:bold}
input,select{width:100%;padding:11px;border-radius:7px;border:1px solid #444;background:#222;color:#fff;margin:6px 0 12px}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.box{width:100%;max-width:400px;background:#181818;padding:30px;border-radius:16px;text-align:center;box-shadow:0 0 30px #000}
.logo{width:100px;height:100px;object-fit:contain;margin-bottom:10px}
.orange{color:#ff7900}.btn{background:#ff7900;color:#fff;width:100%}
.error{color:#ff5555;margin-top:12px;font-size:14px}.hidden{display:none!important}
header{background:#181818;padding:15px 20px;display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #ff7900}
header small{display:block;color:#aaa;margin-top:4px}
.logout{background:#333;color:#fff}
nav{display:flex;gap:8px;overflow:auto;padding:12px;background:#151515}
nav button{background:#252525;color:#fff;white-space:nowrap}
nav button.active{background:#ff7900}
main{padding:20px;max-width:1200px;margin:auto}
.card{background:#181818;padding:18px;border-radius:12px;margin-bottom:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
h2{margin-top:0}.save{background:#ff7900;color:#fff}
table{width:100%;border-collapse:collapse;margin-top:10px}
th,td{padding:10px;border-bottom:1px solid #333;text-align:left}
th{color:#ff7900}
.tablewrap{overflow:auto}
.badge{padding:5px 8px;background:#333;border-radius:6px}
</style>
</head>

<body>

<div id="loginPage" class="login">
  <div class="box">
    <img class="logo" src="https://rgffzcpsofmjnqdfyolg.supabase.co/storage/v1/object/public/QRIS/1000583091-removebg-preview.png">
    <h2>Welcome Admin</h2>
    <div class="orange"><b>COMMAND CENTER</b></div>
    <div style="margin-bottom:25px">MUDA BERGERAK PROV. SULAWESI SELATAN</div>

    <input id="username" placeholder="Username">
    <input id="password" type="password" placeholder="Password">
    <button class="btn" onclick="login()">LOGIN</button>
    <div id="loginMsg" class="error"></div>
  </div>
</div>

<div id="app" class="hidden">

<header>
  <div>
    <b>COMMAND CENTER</b>
    <small>MUDA BERGERAK SULAWESI SELATAN</small>
  </div>
  <div style="text-align:right">
    <span id="adminInfo"></span>
    <button class="logout" onclick="logout()">Logout</button>
  </div>
</header>

<nav>
  <button id="n-dpw" onclick="showPage('dpw')">Struktur DPW</button>
  <button id="n-dpd" onclick="showPage('dpd')">24 DPD</button>
  <button id="n-bidang" onclick="showPage('bidang')">Bidang DPD</button>
</nav>

<main>

<section id="page-dpw" class="page">
  <div class="card">
    <h2>Struktur DPW</h2>
    <div class="grid">
      <label>Ketua<input id="dpw_ketua"></label>
      <label>Sekretaris<input id="dpw_sekretaris"></label>
      <label>Bendahara<input id="dpw_bendahara"></label>
      <label>Sekretariat<input id="dpw_sekretariat"></label>
      <label>Politik<input id="dpw_politik"></label>
      <label>Hukum<input id="dpw_hukum"></label>
      <label>Sosial Kemasyarakatan<input id="dpw_sosial_kemasyarakatan"></label>
      <label>Keorganisasian<input id="dpw_keorganisasian"></label>
      <label>Humas & Media<input id="dpw_humas_media"></label>
      <label>Ekonomi Kreatif<input id="dpw_ekonomi_kreatif"></label>
    </div>
    <button class="save" onclick="saveDPW()">Simpan Struktur DPW</button>
    <div id="dpwMsg"></div>
  </div>
</section>

<section id="page-dpd" class="page hidden">
  <div class="card">
    <h2>Monitoring 24 DPD</h2>
    <div class="tablewrap">
      <table>
        <thead>
          <tr><th>DPD</th><th>Ketua</th><th>Sekretariat</th><th>Progress</th><th>Aksi</th></tr>
        </thead>
        <tbody id="dpdTable"></tbody>
      </table>
    </div>
  </div>

  <div id="editDPD" class="card hidden">
    <h2 id="editTitle">Edit DPD</h2>
    <input type="hidden" id="editId">
    <div class="grid">
      <label>Ketua<input id="e_ketua"></label>
      <label>Sekretaris<input id="e_sekretaris"></label>
      <label>Bendahara<input id="e_bendahara"></label>
      <label>Sekretariat<input id="e_sekretariat"></label>
      <label>Progress (%)<input id="e_progress" type="number" min="0" max="100"></label>
    </div>
    <button class="save" onclick="saveDPD()">Simpan</button>
    <button onclick="document.getElementById('editDPD').classList.add('hidden')">Batal</button>
    <div id="dpdMsg"></div>
  </div>
</section>

<section id="page-bidang" class="page hidden">
  <div class="card">
    <h2>Bidang DPD</h2>
    <select id="bidangDpd" onchange="loadBidang()"></select>
    <select id="bidangNama" onchange="loadBidang()">
      <option value="Politik">Politik</option>
      <option value="Hukum">Hukum</option>
      <option value="Sosial Kemasyarakatan">Sosial Kemasyarakatan</option>
      <option value="Keorganisasian">Keorganisasian</option>
      <option value="Humas & Media">Humas & Media</option>
      <option value="Ekonomi Kreatif">Ekonomi Kreatif</option>
    </select>

    <label>Ketua Bidang<input id="b_ketua"></label>
    <label>Progress (%)<input id="b_progress" type="number" min="0" max="100"></label>
    <button class="save" onclick="saveBidang()">Simpan Bidang</button>
    <div id="bidangMsg"></div>
  </div>
</section>

</main>
</div>

<script>
const SUPABASE_URL="https://rgffzcpsofmjnqdfyolg.supabase.co";
const SUPABASE_KEY="sb_publishable_ZfZ1m8X7gadvnoAQh9XmNg_hyupNKb6";

const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{
  auth:{
    persistSession:true,
    autoRefreshToken:true,
    detectSessionInUrl:false
  }
});

let currentAdmin=null;
let dpdData=[];
let bidangData=[];

/* LOGIN */
async function login(){
  const username=document.getElementById("username").value.trim();
  const password=document.getElementById("password").value;
  const msg=document.getElementById("loginMsg");

  msg.style.color="#ff5555";
  msg.textContent="Memeriksa Login...";

  if(!username||!password){
    msg.textContent="Username dan password wajib diisi.";
    return;
  }

  try{
    const res=await fetch(SUPABASE_URL+"/functions/v1/admin-login",{
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        "apikey":SUPABASE_KEY,
        "Authorization":"Bearer "+SUPABASE_KEY
      },
      body:JSON.stringify({username,password})
    });

    const text=await res.text();
    let data;

    try{data=JSON.parse(text)}
    catch{
      throw new Error("Response server tidak valid.");
    }

    if(!res.ok){
      throw new Error(data.error||data.message||"Login gagal.");
    }

    if(!data.session||!data.session.access_token||!data.session.refresh_token){
      throw new Error("Session login tidak ditemukan.");
    }

    const sessionResult=await db.auth.setSession({
      access_token:data.session.access_token,
      refresh_token:data.session.refresh_token
    });

    if(sessionResult.error){
      throw new Error(sessionResult.error.message);
    }

    currentAdmin=data.admin;
    localStorage.setItem("cc_admin",JSON.stringify(currentAdmin));

    openApp();

  }catch(e){
    console.error(e);
    msg.textContent=e.message||"Login gagal.";
  }
}

/* SESSION */
async function checkSession(){
  try{
    const saved=localStorage.getItem("cc_admin");
    const session=await db.auth.getSession();

    if(saved&&session.data.session){
      currentAdmin=JSON.parse(saved);
      openApp();
    }
  }catch(e){
    console.error(e);
  }
}

/* APP */
function openApp(){
  document.getElementById("loginPage").classList.add("hidden");
  document.getElementById("app").classList.remove("hidden");

  document.getElementById("adminInfo").innerHTML=
    (currentAdmin.username||"Admin")+" <small>"+(currentAdmin.role||"")+"</small>";

  setupAccess();
  loadAll();
}

/* ACCESS */
function setupAccess(){
  const isDPD=currentAdmin.role==="DPD";

  document.getElementById("n-dpw").style.display=isDPD?"none":"block";

  if(isDPD){
    showPage("dpd");
  }else{
    showPage("dpw");
  }
}

/* NAV */
function showPage(page){
  document.querySelectorAll(".page").forEach(x=>x.classList.add("hidden"));
  document.querySelectorAll("nav button").forEach(x=>x.classList.remove("active"));

  document.getElementById("page-"+page).classList.remove("hidden");
  document.getElementById("n-"+page).classList.add("active");
}

/* LOAD ALL */
async function loadAll(){
  await loadDPW();
  await loadDPD();
  loadBidangSelect();
}

/* DPW */
async function loadDPW(){
  try{
    const {data,error}=await db.from("struktur_dpw").select("*").limit(1);
    if(error)throw error;
    if(!data||!data.length)return;

    const x=data[0];

    [
      "ketua","sekretaris","bendahara","sekretariat",
      "politik","hukum","sosial_kemasyarakatan",
      "keorganisasian","humas_media","ekonomi_kreatif"
    ].forEach(k=>{
      const el=document.getElementById("dpw_"+k);
      if(el)el.value=x[k]||"";
    });
  }catch(e){
    console.error("DPW:",e);
  }
}

async function saveDPW(){
  const msg=document.getElementById("dpwMsg");

  if(currentAdmin.role==="DPD"){
    msg.textContent="Akses ditolak.";
    return;
  }

  const obj={};

  [
    "ketua","sekretaris","bendahara","sekretariat",
    "politik","hukum","sosial_kemasyarakatan",
    "keorganisasian","humas_media","ekonomi_kreatif"
  ].forEach(k=>{
    obj[k]=document.getElementById("dpw_"+k).value;
  });

  try{
    const {data}=await db.from("struktur_dpw").select("id").limit(1);

    let result;

    if(data&&data.length){
      result=await db.from("struktur_dpw").update(obj).eq("id",data[0].id);
    }else{
      result=await db.from("struktur_dpw").insert(obj);
    }

    if(result.error)throw result.error;
    msg.textContent="✓ Struktur DPW tersimpan.";
  }catch(e){
    msg.textContent="Gagal: "+e.message;
  }
}

/* DPD */
async function loadDPD(){
  try{
    let q=db.from("DPD").select("*").order("id");

    if(currentAdmin.role==="DPD"){
      q=q.eq("id",currentAdmin.dpd_id);
    }

    const {data,error}=await q;
    if(error)throw error;

    dpdData=data||[];
    renderDPD();
  }catch(e){
    console.error("DPD:",e);
    document.getElementById("dpdTable").innerHTML=
      "<tr><td colspan='5'>Gagal memuat data.</td></tr>";
  }
}

function renderDPD(){
  const tbody=document.getElementById("dpdTable");
  tbody.innerHTML="";

  dpdData.forEach((x,i)=>{
    const no=x.id||i+1;
    const tr=document.createElement("tr");

    tr.innerHTML=`
      <td>DPD ${String(no).padStart(2,"0")}</td>
      <td>${x.ketua||"-"}</td>
      <td>${x.sekretariat||"-"}</td>
      <td><span class="badge">${x.progress||0}%</span></td>
      <td><button onclick="editDPD(${x.id})">Edit</button></td>
    `;

    tbody.appendChild(tr);
  });
}

function editDPD(id){
  const x=dpdData.find(a=>a.id==id);
  if(!x)return;

  if(currentAdmin.role==="DPD"&&Number(id)!==Number(currentAdmin.dpd_id)){
    alert("Anda hanya dapat mengedit DPD sendiri.");
    return;
  }

  document.getElementById("editDPD").classList.remove("hidden");
  document.getElementById("editTitle").textContent="Edit DPD "+String(id).padStart(2,"0");
  document.getElementById("editId").value=id;

  document.getElementById("e_ketua").value=x.ketua||"";
  document.getElementById("e_sekretaris").value=x.sekretaris||"";
  document.getElementById("e_bendahara").value=x.bendahara||"";
  document.getElementById("e_sekretariat").value=x.sekretariat||"";
  document.getElementById("e_progress").value=x.progress||0;
}

async function saveDPD(){
  const id=document.getElementById("editId").value;

  if(currentAdmin.role==="DPD"&&Number(id)!==Number(currentAdmin.dpd_id)){
    alert("Akses ditolak.");
    return;
  }

  const obj={
    ketua:document.getElementById("e_ketua").value,
    sekretaris:document.getElementById("e_sekretaris").value,
    bendahara:document.getElementById("e_bendahara").value,
    sekretariat:document.getElementById("e_sekretariat").value,
    progress:Number(document.getElementById("e_progress").value)||0
  };

  try{
    const {error}=await db.from("DPD").update(obj).eq("id",id);
    if(error)throw error;

    document.getElementById("dpdMsg").textContent="✓ Data DPD tersimpan.";
    document.getElementById("editDPD").classList.add("hidden");
    await loadDPD();
  }catch(e){
    document.getElementById("dpdMsg").textContent="Gagal: "+e.message;
  }
}

/* BIDANG */
function loadBidangSelect(){
  const s=document.getElementById("bidangDpd");
  s.innerHTML="";

  if(currentAdmin.role==="DPD"){
    const o=document.createElement("option");
    o.value=currentAdmin.dpd_id;
    o.textContent="DPD "+String(currentAdmin.dpd_id).padStart(2,"0");
    s.appendChild(o);
  }else{
    for(let i=1;i<=24;i++){
      const o=document.createElement("option");
      o.value=i;
      o.textContent="DPD "+String(i).padStart(2,"0");
      s.appendChild(o);
    }
  }

  loadBidang();
}

async function loadBidang(){
  const dpd=document.getElementById("bidangDpd").value;
  const bidang=document.getElementById("bidangNama").value;

  if(!dpd)return;

  try{
    const {data,error}=await db
      .from("BIDANG_DPD")
      .select("*")
      .eq("dpd_id",dpd)
      .eq("bidang",bidang)
      .limit(1);

    if(error)throw error;

    const x=data&&data.length?data[0]:null;

    document.getElementById("b_ketua").value=x?.ketua_bidang||"";
    document.getElementById("b_progress").value=x?.progress||0;
  }catch(e){
    console.error("Bidang:",e);
  }
}

async function saveBidang(){
  const dpd=Number(document.getElementById("bidangDpd").value);
  const bidang=document.getElementById("bidangNama").value;

  if(currentAdmin.role==="DPD"&&dpd!==Number(currentAdmin.dpd_id)){
    alert("Anda hanya dapat mengedit bidang DPD sendiri.");
    return;
  }

  const obj={
    dpd_id:dpd,
    bidang:bidang,
    ketua_bidang:document.getElementById("b_ketua").value,
    progress:Number(document.getElementById("b_progress").value)||0
  };

  try{
    const {data,error}=await db
      .from("BIDANG_DPD")
      .select("id")
      .eq("dpd_id",dpd)
      .eq("bidang",bidang)
      .limit(1);

    if(error)throw error;

    let result;

    if(data&&data.length){
      result=await db
        .from("BIDANG_DPD")
        .update({
          ketua_bidang:obj.ketua_bidang,
          progress:obj.progress
        })
        .eq("id",data[0].id);
    }else{
      result=await db.from("BIDANG_DPD").insert(obj);
    }

    if(result.error)throw result.error;

    document.getElementById("bidangMsg").textContent="✓ Data bidang tersimpan.";
  }catch(e){
    document.getElementById("bidangMsg").textContent="Gagal: "+e.message;
  }
}

/* LOGOUT */
async function logout(){
  await db.auth.signOut();
  localStorage.removeItem("cc_admin");
  currentAdmin=null;
  location.reload();
}

document.getElementById("password").addEventListener("keydown",e=>{
  if(e.key==="Enter")login();
});

checkSession();
</script>

</body>
</html>
